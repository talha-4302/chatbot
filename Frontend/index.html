<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f4f4f5; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .assistant { align-self: flex-start; background: #fff; border: 1px solid #ddd; }
  form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #ddd; }
  input { flex: 1; padding: 10px; font: inherit; }
  button { padding: 10px 16px; font: inherit; }
</style>
</head>
<body>
<div id="log"></div>
<form id="f"><input id="t" placeholder="Type a message..." autocomplete="off" autofocus><button>Send</button></form>
<script>
  const API = 'http://localhost:3000/chat';
  const history = []; // stateless backend: we resend the full history each turn
  const log = document.getElementById('log'), t = document.getElementById('t');

  function add(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const text = t.value.trim();
    if (!text) return;
    t.value = '';
    add('user', text);
    history.push({ role: 'user', content: text });
    const pending = add('assistant', '...');
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      if (!r.ok) throw new Error((await r.json()).message || r.status);
      const { reply } = await r.json();
      pending.textContent = reply;
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      pending.textContent = 'Error: ' + err.message;
      history.pop(); // drop the failed user turn so history stays valid
    }
  };
</script>
</body>
</html>
